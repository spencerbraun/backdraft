[project]
name = "backdraft"
version = "0.2.1"
description = "Drop-in provenance for factual claims: one click from any claim to the evidence behind it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
license-files = ["LICENSE"]
# The kernel is pure: stdlib only. These are the runtime dependencies of the
# layers above it — the CLI (typer) and the built-in extractors (pdfplumber for
# the PDF text layer, openpyxl for workbooks). The registry needs nothing beyond
# the standard library's `sqlite3`.
dependencies = [
    "typer>=0.12",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The VLM extractor: pdf -> page images -> an OpenAI-compatible vision model.
# `pdf2image` shells out to poppler, which is installed separately.
vlm = ["openai>=1.0", "pdf2image>=1.17"]
# The entailment verifier (bind --check entail).
entail = ["anthropic>=0.40"]

[project.scripts]
backdraft = "backdraft.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.urls]
Homepage = "https://backdraft.dev"
Documentation = "https://backdraft.dev/docs.html"
Repository = "https://github.com/spencerbraun/backdraft"
Roadmap = "https://github.com/spencerbraun/backdraft/blob/main/ROADMAP.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backdraft"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "backdraft/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
